<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업 게임 모음</title><link rel="stylesheet" href="common/style.css"></head>
<body><main>
<h1>수업 게임 모음</h1>
<div id="list"></div>
</main>
<script type="module">
// 목록은 games.json에서(새 게임은 tools/new_game.py가 자동으로 한 줄 추가)
const games = await (await fetch("games.json", { cache: "no-store" })).json();
document.getElementById("list").replaceChildren(...games.map(g => {
  const d = document.createElement("div"); d.className = "card";
  const h = document.createElement("h2"); h.textContent = g.name;
  const p = document.createElement("p"); p.textContent = g.subject;
  const home = g.url || `${g.id}/`; // 다른 저장소 게임(url)도 교사 화면은 같은 폴더의 teacher.html
  const a = document.createElement("a"); a.href = home; a.textContent = "학생 입장";
  const t = document.createElement("a"); t.href = `${home}teacher.html`; t.textContent = "교사 관리";
  d.append(h, p, a, " · ", t);
  return d;
}));
</script>
</body></html>
